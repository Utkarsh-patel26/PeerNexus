# =============================================================================
# CI Pipeline — Primary build, test, scan, and publish workflow
# =============================================================================
# Triggers: push to main/develop, all pull requests
# Stages:  quality → build → test → integration → artifact → docker
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality Gates
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven validation
        run: mvn validate -B -q

      - name: Checkstyle
        run: mvn checkstyle:check -B

  # ---------------------------------------------------------------------------
  # 2. Build & Unit Tests
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run unit tests
        run: mvn clean verify -B -DskipITs

      - name: JaCoCo coverage verification
        run: mvn jacoco:check@jacoco-check -B

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Integration Tests
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      seeder:
        image: linuxserver/transmission:latest
        env:
          PUID: 1000
          PGID: 1000
          TZ: UTC
          USER: admin
          PASS: admin
        ports:
          - 9091:9091
          - 51413:51413
          - 51413:51413/udp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Wait for seeder readiness
        run: |
          echo "Waiting for Transmission seeder..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091 > /dev/null 2>&1; then
              echo "Seeder is ready."
              break
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          mvn verify -B \
            -Dtest.integration=true \
            -Dit.test=*IntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. Artifact creation
  # ---------------------------------------------------------------------------
  artifact:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build fat JAR
        run: mvn clean package -B -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtorrent-gui-jar
          path: target/jtorrent-gui.jar
          retention-days: 30

      - name: Generate SBOM
        run: mvn cyclonedx:makeAggregateBom -B -q

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/bom.xml
            target/bom.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 5. Docker build + push (main branch only)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image reference
        id: image
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        env:
          TRIVY_IMAGE: aquasec/trivy:0.56.1
          TARGET_IMAGE: ${{ steps.image.outputs.ref }}:latest
        run: |
          mkdir -p "${{ runner.temp }}/trivy-cache"
          docker run --rm \
            -e TRIVY_USERNAME="${{ github.actor }}" \
            -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            -v "${{ github.workspace }}:/workspace" \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --output /workspace/trivy-report.txt \
            "$TARGET_IMAGE"

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.txt
          retention-days: 30

      - name: Verify container health
        run: |
          echo "Starting container for health verification..."
          docker run -d --name health-check \
            -p 8080:8080 \
            ${{ steps.image.outputs.ref }}:latest
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' health-check 2>/dev/null || echo "starting")
            echo "Attempt $i/20 — health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Container did not become healthy within timeout"
              docker logs health-check
              docker stop health-check && docker rm health-check
              exit 1
            fi
            sleep 5
          done
          docker stop health-check && docker rm health-check
