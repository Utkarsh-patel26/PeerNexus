# =============================================================================
# Automatic Semantic Versioning — Commit-based version bumping
# =============================================================================
# Analyzes commit messages on main branch to determine the next version.
# Convention:
#   feat:     → minor bump (1.0.0 → 1.1.0)
#   fix:      → patch bump (1.0.0 → 1.0.1)
#   breaking: → major bump (1.0.0 → 2.0.0)
#   BREAKING CHANGE in body → major bump
#
# Creates a git tag and triggers the existing release.yml workflow.
# Compatible with manual tagging — respects existing tags.
# =============================================================================

name: Auto Version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force a version bump type (patch, minor, major)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  version:
    name: Semantic Version
    runs-on: ubuntu-latest
    # Skip if the push is a tag or if the commit was from this workflow
    if: |
      !startsWith(github.ref, 'refs/tags/') &&
      !contains(github.event.head_commit.message, '[skip-version]') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          LATEST=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No existing tags found, starting from v0.0.0"
          fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST"

      - name: Analyze commits for version bump
        id: bump
        run: |
          LATEST_TAG="${{ steps.latest_tag.outputs.tag }}"
          FORCE_BUMP="${{ github.event.inputs.force_bump }}"

          if [ -n "$FORCE_BUMP" ]; then
            echo "bump=$FORCE_BUMP" >> "$GITHUB_OUTPUT"
            echo "Forced bump: $FORCE_BUMP"
            exit 0
          fi

          # Get commits since last tag
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s%n%b" 2>/dev/null || echo "")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"

          BUMP="none"

          # Check for breaking changes (major)
          if echo "$COMMITS" | grep -qiE "^breaking(\(.*\))?:|BREAKING CHANGE"; then
            BUMP="major"
          # Check for features (minor)
          elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          # Check for fixes (patch)
          elif echo "$COMMITS" | grep -qiE "^fix(\(.*\))?:"; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Determined bump: $BUMP"

      - name: Calculate next version
        id: next_version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.latest_tag.outputs.tag }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          # Strip 'v' prefix
          VERSION="${CURRENT#v}"

          # Split into components
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)

          # Default to 0 if empty
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (bump: $BUMP)"

      - name: Create and push tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEXT="${{ steps.next_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "chore(release): $NEXT [skip-version]

          Automated release based on conventional commits.
          Bump type: ${{ steps.bump.outputs.bump }}"
          git push origin "$NEXT"
          echo "::notice::Created and pushed tag $NEXT — release workflow will trigger automatically."

      - name: Summary
        if: always()
        run: |
          echo "## Auto Version Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest tag | \`${{ steps.latest_tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump type | \`${{ steps.bump.outputs.bump }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.bump.outputs.bump }}" != "none" ]; then
            echo "| New version | \`${{ steps.next_version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| New version | _(no bump needed)_ |" >> "$GITHUB_STEP_SUMMARY"
          fi
