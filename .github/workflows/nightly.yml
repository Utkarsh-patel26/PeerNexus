# =============================================================================
# Nightly Pipeline — Scheduled regression & stress testing
# =============================================================================
# Runs every night at 02:00 UTC against the main branch.
# Catches regressions that short PR builds may miss.
# =============================================================================

name: Nightly

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Full test suite (unit + integration)
  # ---------------------------------------------------------------------------
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    services:
      seeder:
        image: linuxserver/transmission:latest
        env:
          PUID: 1000
          PGID: 1000
          TZ: UTC
          USER: admin
          PASS: admin
        ports:
          - 9091:9091
          - 51413:51413
          - 51413:51413/udp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Wait for seeder readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091 > /dev/null 2>&1; then
              echo "Seeder ready"; break
            fi
            sleep 2
          done

      - name: Run full verify (unit + integration)
        run: mvn clean verify -B -Dtest.integration=true -DfailIfNoTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Stress / long-running scenarios + Performance benchmarking
  # ---------------------------------------------------------------------------
  stress-tests:
    name: Stress & Performance Tests
    runs-on: ubuntu-latest
    needs: full-test-suite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run stress test profile
        run: |
          mvn test -B \
            -Dtest="**/*Stress*,**/*Load*,**/*Performance*" \
            -DfailIfNoTests=false \
            -Dsurefire.timeout=600

      - name: Collect performance metrics
        if: always()
        run: |
          mkdir -p target/performance-reports

          echo "# Performance Benchmark Report" > target/performance-reports/benchmark-summary.md
          echo "" >> target/performance-reports/benchmark-summary.md
          echo "**Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> target/performance-reports/benchmark-summary.md
          echo "**Commit**: ${{ github.sha }}" >> target/performance-reports/benchmark-summary.md
          echo "**Branch**: ${{ github.ref_name }}" >> target/performance-reports/benchmark-summary.md
          echo "**Runner**: $(uname -a)" >> target/performance-reports/benchmark-summary.md
          echo "" >> target/performance-reports/benchmark-summary.md

          echo "## Test Execution Times" >> target/performance-reports/benchmark-summary.md
          echo "" >> target/performance-reports/benchmark-summary.md
          echo "| Test | Time (s) | Status |" >> target/performance-reports/benchmark-summary.md
          echo "|------|----------|--------|" >> target/performance-reports/benchmark-summary.md

          # Parse Surefire XML reports for timing data
          for xml in target/surefire-reports/TEST-*.xml; do
            if [ -f "$xml" ]; then
              TEST_NAME=$(grep -oP 'name="\K[^"]+' "$xml" | head -1)
              TEST_TIME=$(grep -oP 'time="\K[^"]+' "$xml" | head -1)
              TEST_ERRORS=$(grep -oP 'errors="\K[^"]+' "$xml" | head -1)
              TEST_FAILURES=$(grep -oP 'failures="\K[^"]+' "$xml" | head -1)
              if [ "${TEST_ERRORS:-0}" = "0" ] && [ "${TEST_FAILURES:-0}" = "0" ]; then
                STATUS="✅ Pass"
              else
                STATUS="❌ Fail"
              fi
              echo "| ${TEST_NAME:-unknown} | ${TEST_TIME:-N/A} | ${STATUS} |" >> target/performance-reports/benchmark-summary.md
            fi
          done

          # Extract JVM-level metrics if available
          echo "" >> target/performance-reports/benchmark-summary.md
          echo "## JVM Information" >> target/performance-reports/benchmark-summary.md
          echo "" >> target/performance-reports/benchmark-summary.md
          echo '```' >> target/performance-reports/benchmark-summary.md
          java -version 2>&1 >> target/performance-reports/benchmark-summary.md
          echo '```' >> target/performance-reports/benchmark-summary.md

          # Copy raw Surefire reports
          cp -r target/surefire-reports/ target/performance-reports/raw-results/ 2>/dev/null || true

          echo "Performance report generated."

      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload performance benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-${{ github.run_number }}
          path: target/performance-reports/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 3. Nightly security scan (same as security.yml but on schedule)
  # ---------------------------------------------------------------------------
  nightly-security:
    name: Nightly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check -B \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-owasp-report
          path: target/dependency-check/
          retention-days: 30
